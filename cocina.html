<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Cocina</title>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#111827;
}

#pedidos{
    display:grid;
    gap:15px;
    margin-top:20px;
}

.tarjeta{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

.mesa{
    font-size:22px;
    font-weight:bold;
    color:#2563eb;
}

.total{
    font-weight:bold;
    margin-top:10px;
}

.estado{
    margin-top:10px;
    font-weight:bold;
}

.btn{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    margin-top:10px;
    margin-right:5px;
    font-size:14px;
}

.preparando{
    background:#f59e0b;
}

.listo{
    background:#16a34a;
}

.btn:hover{
    opacity:.85;
}

.vacio{
    text-align:center;
    background:white;
    padding:30px;
    border-radius:15px;
    color:#666;
}

.producto{
    margin-bottom:5px;
}

</style>

</head>


<body>


<h1>
    👨‍🍳 PANEL DE COCINA
</h1>


<div id="pedidos">

    <div class="vacio">
        Cargando pedidos...
    </div>

</div>



<script>


// ==================================================
// VERIFICAR SUPABASE
// ==================================================

console.log("Panel de cocina iniciado.");

console.log(
    "Supabase:",
    window.supabaseClient
);


// ==================================================
// CARGAR PEDIDOS
// ==================================================

async function cargarPedidos(){

    console.log("Cargando pedidos...");


    try{

        // ==========================================
        // CONSULTAR PEDIDOS
        // ==========================================

        const resultado =
            await window.supabaseClient
            .from("pedidos")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        const data =
            resultado.data;

        const error =
            resultado.error;


        console.log(
            "PEDIDOS:",
            data
        );


        console.log(
            "ERROR:",
            error
        );


        // ==========================================
        // ERROR
        // ==========================================

        if(error){

            console.error(
                "Error cargando pedidos:",
                error
            );


            document.getElementById(
                "pedidos"
            ).innerHTML = `

                <div class="vacio">

                    ❌ Error al cargar
                    los pedidos.

                    <br><br>

                    ${error.message || ""}

                </div>

            `;

            return;

        }


        // ==========================================
        // CONTENEDOR
        // ==========================================

        const contenedor =
            document.getElementById(
                "pedidos"
            );


        contenedor.innerHTML = "";


        // ==========================================
        // NO HAY PEDIDOS
        // ==========================================

        if(
            !data ||
            data.length === 0
        ){

            contenedor.innerHTML = `

                <div class="vacio">

                    🍽️

                    <br><br>

                    No hay pedidos
                    todavía.

                </div>

            `;

            return;

        }


        // ==========================================
        // MOSTRAR PEDIDOS
        // ==========================================

        data.forEach(
            pedido => {


                let productosHTML = "";


                // ==================================
                // SI LA COLUMNA ES "pedido"
                // ==================================

                if(
                    Array.isArray(
                        pedido.pedido
                    )
                ){

                    pedido.pedido.forEach(
                        producto => {

                            productosHTML += `

                                <li class="producto">

                                    ${producto.nombre || "Producto"}

                                </li>

                            `;

                        }
                    );

                }


                // ==================================
                // SI LA COLUMNA ES "productos"
                // ==================================

                else if(
                    Array.isArray(
                        pedido.productos
                    )
                ){

                    pedido.productos.forEach(
                        producto => {

                            productosHTML += `

                                <li class="producto">

                                    ${producto.nombre || "Producto"}

                                </li>

                            `;

                        }
                    );

                }


                // ==================================
                // ESTADO
                // ==================================

                const estado =
                    pedido.estado ||
                    "pendiente";


                // ==================================
                // ID
                // ==================================

                const id =
                    String(
                        pedido.id
                    ).replace(
                        /'/g,
                        "\\'"
                    );


                // ==================================
                // TARJETA
                // ==================================

                contenedor.innerHTML += `

                    <div class="tarjeta">


                        <div class="mesa">

                            Mesa ${pedido.mesa}

                        </div>


                        <br>


                        <strong>
                            Pedido:
                        </strong>


                        <ul>

                            ${
                                productosHTML ||
                                "<li>Sin productos</li>"
                            }

                        </ul>


                        <div class="total">

                            Total:
                            $${Number(
                                pedido.total || 0
                            ).toFixed(2)}

                        </div>


                        <div class="estado">

                            Estado:
                            ${estado}

                        </div>


                        <button
                            class="btn preparando"
                            onclick="
                                actualizarEstado(
                                    '${id}',
                                    'Preparando'
                                )
                            ">

                            👨‍🍳 Preparando

                        </button>


                        <button
                            class="btn listo"
                            onclick="
                                actualizarEstado(
                                    '${id}',
                                    'Listo'
                                )
                            ">

                            ✅ Listo

                        </button>


                    </div>

                `;

            }
        );


    }catch(error){


        console.error(
            "Error inesperado:",
            error
        );


        document.getElementById(
            "pedidos"
        ).innerHTML = `

            <div class="vacio">

                ❌ Ocurrió un error
                al cargar los pedidos.

            </div>

        `;

    }

}



// ==================================================
// ACTUALIZAR ESTADO
// ==================================================

async function actualizarEstado(
    id,
    estado
){

    console.log(
        "Actualizando:",
        id,
        estado
    );


    try{

        const resultado =
            await window.supabaseClient
            .from("pedidos")
            .update({

                estado:estado

            })
            .eq(
                "id",
                id
            );


        if(
            resultado.error
        ){

            console.error(
                resultado.error
            );


            alert(
                "No se pudo actualizar el estado."
            );

            return;

        }


        console.log(
            "Estado actualizado correctamente."
        );


        // Volver a cargar pedidos

        cargarPedidos();


    }catch(error){

        console.error(
            error
        );


        alert(
            "Ocurrió un error al actualizar."
        );

    }

}



// ==================================================
// TIEMPO REAL
// ==================================================

function activarTiempoReal(){

    console.log(
        "Activando tiempo real..."
    );


    window.supabaseClient

    .channel(
        "pedidos-cocina"
    )

    .on(

        "postgres_changes",

        {

            event:"*",

            schema:"public",

            table:"pedidos"

        },

        payload => {


            console.log(
                "Cambio detectado:",
                payload
            );


            // Recargar pedidos

            cargarPedidos();


            // Intentar reproducir sonido

            try{

                const audio =
                    new Audio(
                        "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
                    );


                audio.play().catch(
                    () => {

                        console.log(
                            "El navegador bloqueó el sonido."
                        );

                    }
                );


            }catch(error){

                console.log(
                    "No se pudo reproducir el sonido."
                );

            }

        }

    )

    .subscribe(

        status => {

            console.log(
                "Estado del canal:",
                status
            );

        }

    );

}



// ==================================================
// INICIAR
// ==================================================

cargarPedidos();

activarTiempoReal();


</script>


</body>

</html>
