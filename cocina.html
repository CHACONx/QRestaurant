<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panel Cocina</title>


    <!-- ==========================================
         SUPABASE
    =========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            margin: 0;

            padding: 20px;

        }


        h1 {

            text-align: center;

            color: #111827;

        }


        #pedidos {

            display: grid;

            gap: 15px;

            margin-top: 20px;

        }


        .tarjeta {

            background: white;

            border-radius: 15px;

            padding: 20px;

            box-shadow:
                0 4px 15px rgba(0,0,0,.1);

        }


        .mesa {

            font-size: 22px;

            font-weight: bold;

            color: #2563eb;

        }


        .total {

            font-weight: bold;

            margin-top: 10px;

            font-size: 18px;

        }


        .estado {

            margin-top: 10px;

            font-weight: bold;

        }


        .btn {

            border: none;

            padding: 10px 15px;

            border-radius: 8px;

            cursor: pointer;

            color: white;

            margin-top: 10px;

            margin-right: 5px;

            font-size: 14px;

        }


        .preparando {

            background: #f59e0b;

        }


        .listo {

            background: #16a34a;

        }


        .btn:hover {

            opacity: .85;

        }


        .vacio {

            text-align: center;

            background: white;

            padding: 30px;

            border-radius: 15px;

            color: #666;

        }


        .producto {

            margin-bottom: 8px;

            padding: 8px;

            background: #f9fafb;

            border-radius: 8px;

        }


        .producto-nombre {

            font-weight: bold;

        }


        .producto-detalle {

            color: #555;

            font-size: 14px;

        }


        .fecha {

            color: #777;

            font-size: 13px;

            margin-top: 10px;

        }


        .estado-pendiente {

            color: #dc2626;

        }


        .estado-preparando {

            color: #d97706;

        }


        .estado-listo {

            color: #16a34a;

        }

    </style>

</head>


<body>


    <h1>
        👨‍🍳 PANEL DE COCINA
    </h1>


    <div id="pedidos">

        <div class="vacio">

            ⏳ Cargando pedidos...

        </div>

    </div>



<script>


/* ==================================================
   VERIFICAR SUPABASE
================================================== */

console.log(
    "===================================="
);

console.log(
    "👨‍🍳 PANEL DE COCINA INICIADO"
);

console.log(
    "Supabase:",
    window.supabaseClient
);

console.log(
    "===================================="
);



/* ==================================================
   CARGAR PEDIDOS
================================================== */

async function cargarPedidos() {


    console.log(
        "📥 Cargando pedidos..."
    );


    try {


        /*
           Verificar que exista Supabase.
        */

        if (!window.supabaseClient) {


            document.getElementById(
                "pedidos"
            ).innerHTML = `

                <div class="vacio">

                    ❌ Supabase no está conectado.

                    <br><br>

                    Revisa tu archivo
                    <strong>supabase.js</strong>.

                </div>

            `;


            return;

        }



        /*
           Consultar tabla pedidos.
        */

        const resultado =

            await window.supabaseClient

            .from("pedidos")

            .select("*")

            .order(
                "created_at",
                {
                    ascending: false
                }
            );



        const data =
            resultado.data;


        const error =
            resultado.error;



        console.log(
            "📦 PEDIDOS:",
            data
        );


        console.log(
            "❌ ERROR:",
            error
        );



        /* ==========================================
           ERROR
        =========================================== */

        if (error) {


            console.error(
                "Error cargando pedidos:",
                error
            );


            document.getElementById(
                "pedidos"
            ).innerHTML = `

                <div class="vacio">

                    ❌ Error al cargar los pedidos.

                    <br><br>

                    ${error.message || ""}

                </div>

            `;


            return;

        }



        /* ==========================================
           CONTENEDOR
        =========================================== */

        const contenedor =
            document.getElementById(
                "pedidos"
            );


        contenedor.innerHTML = "";



        /* ==========================================
           SIN PEDIDOS
        =========================================== */

        if (
            !data ||
            data.length === 0
        ) {


            contenedor.innerHTML = `

                <div class="vacio">

                    🍽️

                    <br><br>

                    No hay pedidos todavía.

                </div>

            `;


            return;

        }



        /* ==========================================
           MOSTRAR PEDIDOS
        =========================================== */

        data.forEach(
            function(pedido) {


                /*
                   La columna REAL de Supabase
                   se llama "pedidos".
                */

                let productos =
                    pedido.pedidos;



                /*
                   Si por alguna razón llega
                   como texto JSON, intentar
                   convertirlo.
                */

                if (
                    typeof productos === "string"
                ) {


                    try {

                        productos =
                            JSON.parse(
                                productos
                            );

                    } catch (error) {

                        productos = [];

                    }

                }



                /*
                   Si no es un array,
                   utilizar uno vacío.
                */

                if (
                    !Array.isArray(productos)
                ) {

                    productos = [];

                }



                /* ==================================
                   PRODUCTOS HTML
                ================================== */

                let productosHTML = "";



                productos.forEach(
                    function(producto) {


                        const nombre =
                            producto.nombre ||
                            "Producto";


                        const precio =
                            Number(
                                producto.precio
                            ) || 0;


                        const cantidad =
                            Number(
                                producto.cantidad
                            ) || 0;


                        const subtotal =
                            precio *
                            cantidad;



                        productosHTML += `

                            <li class="producto">

                                <div class="producto-nombre">

                                    ${nombre}

                                </div>


                                <div class="producto-detalle">

                                    Cantidad:
                                    ${cantidad}

                                    <br>

                                    Precio:
                                    $${precio.toFixed(2)}

                                    <br>

                                    Subtotal:
                                    $${subtotal.toFixed(2)}

                                </div>

                            </li>

                        `;

                    }
                );



                /*
                   Si no hay productos.
                */

                if (
                    productosHTML === ""
                ) {

                    productosHTML =
                        "<li>Sin productos</li>";

                }



                /* ==================================
                   ESTADO
                ================================== */

                const estado =
                    pedido.estado ||
                    "Pendiente";



                /*
                   Clase visual del estado.
                */

                let claseEstado =
                    "estado-pendiente";


                if (
                    estado.toLowerCase() ===
                    "preparando"
                ) {

                    claseEstado =
                        "estado-preparando";

                }


                if (
                    estado.toLowerCase() ===
                    "listo"
                ) {

                    claseEstado =
                        "estado-listo";

                }



                /* ==================================
                   FECHA
                ================================== */

                let fechaHTML = "";



                if (
                    pedido.created_at
                ) {


                    const fecha =
                        new Date(
                            pedido.created_at
                        );


                    fechaHTML = `

                        <div class="fecha">

                            📅
                            ${fecha.toLocaleString(
                                "es-SV"
                            )}

                        </div>

                    `;

                }



                /* ==================================
                   ID SEGURO
                ================================== */

                const id =
                    String(
                        pedido.id
                    ).replace(
                        /'/g,
                        "\\'"
                    );



                /* ==================================
                   TARJETA
                ================================== */

                contenedor.innerHTML += `

                    <div class="tarjeta">


                        <div class="mesa">

                            🍽️ Mesa ${pedido.mesa}

                        </div>


                        <br>


                        <strong>

                            🛒 Pedido:

                        </strong>


                        <ul>

                            ${productosHTML}

                        </ul>



                        <div class="total">

                            💰 Total:

                            $${Number(
                                pedido.total || 0
                            ).toFixed(2)}

                        </div>



                        <div
                            class="estado ${claseEstado}"
                        >

                            Estado:

                            ${estado}

                        </div>



                        ${fechaHTML}



                        <br>



                        <button
                            class="btn preparando"
                            type="button"
                            onclick="
                                actualizarEstado(
                                    '${id}',
                                    'Preparando'
                                )
                            "
                        >

                            👨‍🍳 Preparando

                        </button>



                        <button
                            class="btn listo"
                            type="button"
                            onclick="
                                actualizarEstado(
                                    '${id}',
                                    'Listo'
                                )
                            "
                        >

                            ✅ Listo

                        </button>


                    </div>

                `;

            }
        );


    }


    catch (error) {


        console.error(
            "❌ Error inesperado:",
            error
        );


        document.getElementById(
            "pedidos"
        ).innerHTML = `

            <div class="vacio">

                ❌ Ocurrió un error
                al cargar los pedidos.

                <br><br>

                ${error.message || ""}

            </div>

        `;

    }

}



/* ==================================================
   ACTUALIZAR ESTADO
================================================== */

async function actualizarEstado(
    id,
    estado
) {


    console.log(
        "🔄 Actualizando pedido:",
        id,
        "→",
        estado
    );


    try {


        if (!window.supabaseClient) {


            alert(
                "❌ Supabase no está conectado."
            );


            return;

        }



        const resultado =

            await window.supabaseClient

            .from("pedidos")

            .update({

                estado: estado

            })

            .eq(
                "id",
                id
            );



        if (
            resultado.error
        ) {


            console.error(
                "Error actualizando:",
                resultado.error
            );


            alert(

                "❌ No se pudo actualizar el estado.\n\n" +

                resultado.error.message

            );


            return;

        }



        console.log(
            "✅ Estado actualizado."
        );



        /*
           Volver a cargar.
        */

        cargarPedidos();

    }


    catch (error) {


        console.error(
            "❌ Error:",
            error
        );


        alert(
            "❌ Ocurrió un error al actualizar."
        );

    }

}



/* ==================================================
   TIEMPO REAL
================================================== */

function activarTiempoReal() {


    console.log(
        "📡 Activando tiempo real..."
    );



    if (!window.supabaseClient) {


        console.error(
            "❌ Supabase no está disponible."
        );


        return;

    }



    window.supabaseClient

        .channel(
            "pedidos-cocina"
        )

        .on(

            "postgres_changes",

            {

                event: "*",

                schema: "public",

                table: "pedidos"

            },

            function(payload) {


                console.log(
                    "🔔 Cambio detectado:",
                    payload
                );



                /*
                   Volver a cargar pedidos.
                */

                cargarPedidos();



                /*
                   Intentar sonido.
                */

                try {


                    const audio =
                        new Audio(
                            "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
                        );


                    audio.play().catch(
                        function() {

                            console.log(
                                "🔇 El navegador bloqueó el sonido."
                            );

                        }
                    );


                }


                catch (error) {


                    console.log(
                        "No se pudo reproducir sonido."
                    );

                }

            }

        )

        .subscribe(

            function(status) {


                console.log(
                    "📡 Estado del canal:",
                    status
                );

            }

        );

}



/* ==================================================
   INICIAR
================================================== */

cargarPedidos();

activarTiempoReal();


</script>


</body>

</html>
