<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Asistencia</title>

    <link rel="stylesheet" href="estilo.css">

</head>


<body>


<header class="encabezado">

    <div class="logo">
        🆘
    </div>

    <div>

        <h1>ASISTENCIA</h1>

        <p>
            Mesa:
            <span id="mesa"></span>
        </p>

    </div>

</header>



<main class="contenedor">


    <h2>
        ¿En qué podemos ayudarte?
    </h2>

    <p class="subtitulo">
        Selecciona una opción
    </p>



    <div class="opciones-asistencia">


        <button
            class="opcion"
            onclick="solicitarAyuda('Necesito cubiertos')">

            <span class="icono">
                🍴
            </span>

            <span class="titulo">
                Necesito cubiertos
            </span>

        </button>



        <button
            class="opcion"
            onclick="solicitarAyuda('Necesito servilletas')">

            <span class="icono">
                🧻
            </span>

            <span class="titulo">
                Necesito servilletas
            </span>

        </button>



        <button
            class="opcion"
            onclick="solicitarAyuda('Necesito al mesero')">

            <span class="icono">
                🛎️
            </span>

            <span class="titulo">
                Necesito al mesero
            </span>

        </button>



        <button
            class="opcion"
            onclick="solicitarAyuda('Necesito agua')">

            <span class="icono">
                💧
            </span>

            <span class="titulo">
                Necesito agua
            </span>

        </button>



        <button
            class="opcion"
            onclick="solicitarAyuda('Necesito limpiar la mesa')">

            <span class="icono">
                🧹
            </span>

            <span class="titulo">
                Limpiar la mesa
            </span>

        </button>



        <button
            class="opcion"
            onclick="mostrarOtraAsistencia()">

            <span class="icono">
                💬
            </span>

            <span class="titulo">
                Otra solicitud
            </span>

        </button>


    </div>



    <div
        id="otraSolicitud"
        class="otra-solicitud"
        style="display:none;">

        <h3>
            ¿Qué necesitas?
        </h3>

        <br>

        <textarea
            id="mensajeAsistencia"
            rows="4"
            placeholder="Escribe tu solicitud...">
        </textarea>

        <br><br>

        <button
            class="btn-enviar"
            onclick="enviarOtraSolicitud()">

            📨 Enviar solicitud

        </button>

    </div>


    <br><br>


    <button
        class="boton"
        onclick="irAInicio()">

        ← Regresar

    </button>


</main>



<footer>

    <p>
        Restaurante QR
    </p>

</footer>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


// ========================================
// OBTENER LA MESA CORRECTA
// ========================================

const parametros = new URLSearchParams(
    window.location.search
);

let mesa = parametros.get("mesa");


// Si no viene en la URL,
// buscamos la mesa guardada

if (!mesa) {

    mesa = sessionStorage.getItem(
        "clienteMesa"
    );

}


// Si todavía no existe,
// usamos mesa 1 como último recurso

if (!mesa) {

    mesa = "1";

}


// Guardamos la mesa actual

sessionStorage.setItem(
    "clienteMesa",
    mesa
);


// Mostrar la mesa

document.getElementById(
    "mesa"
).textContent = mesa;



// ========================================
// SOLICITAR AYUDA
// ========================================

async function solicitarAyuda(mensaje) {

    const confirmacion = confirm(
        "¿Deseas solicitar:\n\n" +
        mensaje +
        "\n\nMesa: " +
        mesa +
        "?"
    );


    if (!confirmacion) {

        return;

    }


    try {

        // Intentar guardar en Supabase

        if (
            typeof supabase !== "undefined" &&
            supabase
        ) {

            const { error } = await supabase
                .from("asistencias")
                .insert([

                    {
                        mesa: mesa,
                        mensaje: mensaje,
                        estado: "pendiente"
                    }

                ]);


            if (error) {

                console.error(
                    "Error de Supabase:",
                    error
                );

            }

        }


        alert(
            "Solicitud enviada correctamente.\n\n" +
            "Mesa: " +
            mesa +
            "\n" +
            mensaje
        );


    } catch (error) {

        console.error(error);


        alert(
            "La solicitud fue registrada.\n\n" +
            "Mesa: " +
            mesa +
            "\n" +
            mensaje
        );

    }

}



// ========================================
// MOSTRAR OTRA SOLICITUD
// ========================================

function mostrarOtraAsistencia() {

    const formulario =
        document.getElementById(
            "otraSolicitud"
        );


    if (
        formulario.style.display === "none" ||
        formulario.style.display === ""
    ) {

        formulario.style.display = "block";

    } else {

        formulario.style.display = "none";

    }

}



// ========================================
// ENVIAR OTRA SOLICITUD
// ========================================

async function enviarOtraSolicitud() {

    const textarea =
        document.getElementById(
            "mensajeAsistencia"
        );


    const mensaje =
        textarea.value.trim();


    if (!mensaje) {

        alert(
            "Por favor escribe tu solicitud."
        );

        return;

    }


    const confirmacion = confirm(
        "¿Deseas enviar esta solicitud?\n\n" +
        mensaje +
        "\n\nMesa: " +
        mesa +
        "?"
    );


    if (!confirmacion) {

        return;

    }


    try {

        // Guardar en Supabase

        if (
            typeof supabase !== "undefined" &&
            supabase
        ) {

            const { error } = await supabase
                .from("asistencias")
                .insert([

                    {
                        mesa: mesa,
                        mensaje: mensaje,
                        estado: "pendiente"
                    }

                ]);


            if (error) {

                console.error(
                    "Error de Supabase:",
                    error
                );

            }

        }


        alert(
            "Solicitud enviada correctamente.\n\n" +
            "Mesa: " +
            mesa
        );


        textarea.value = "";


        document.getElementById(
            "otraSolicitud"
        ).style.display = "none";


    } catch (error) {

        console.error(error);


        alert(
            "Solicitud enviada.\n\n" +
            "Mesa: " +
            mesa
        );

    }

}



// ========================================
// REGRESAR AL INICIO
// ========================================

function irAInicio() {

    window.location.href =
        "index.html?mesa=" +
        encodeURIComponent(mesa);

}


</script>


</body>

</html>
