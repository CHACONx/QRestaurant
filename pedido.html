<style>

    /* ================================
       PRODUCTOS DEL PEDIDO
    ================================= */

    .producto-pedido {

        display: flex;

        justify-content: space-between;

    @media (max-width: 600px) {

            flex-direction: column;

            align-items: stretch;

        }

        .boton-eliminar {

            width: 100%;

        }

</style>

<!-- ======================================
     SUPABASE
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<!-- ======================================
     JAVASCRIPT DEL PEDIDO
====================================== -->

<script>

    /* =====================================
       OBTENER MESA
    ===================================== */

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    /*
       PRIMERO:
       Obtener mesa desde la URL.

       Ejemplo:
       pedido.html?mesa=2
    */

    let mesa =
        parametros.get("mesa");


    /*
       Si no existe en la URL,
       buscar en sessionStorage.
    */

    if (!mesa) {

        mesa =
            sessionStorage.getItem(
                "clienteMesa"
            );

    }


    /*
       Si todavía no existe,
       usar Mesa 1.
    */

    if (!mesa) {

        mesa = "1";

    }


    /*
       Limpiar espacios.
    */

    mesa =
        String(mesa).trim();


    /*
       Guardar la mesa actual.
    */

    sessionStorage.setItem(
        "clienteMesa",
        mesa
    );


    /*
       Mostrar mesa.
    */

    document.getElementById(
        "mesa"
    ).textContent =
        "Mesa: " + mesa;



    /* =====================================
       CLAVE DEL PEDIDO
    ===================================== */

    /*
       Cada mesa tiene su propio pedido.

       Mesa 1:
       pedido_1

       Mesa 2:
       pedido_2

       Mesa 3:
       pedido_3
    */

    const clavePedido =
        "pedido_" + mesa;



    /* =====================================
       MOSTRAR PEDIDO
    ===================================== */

    function mostrarPedido() {

        const lista =
            document.getElementById(
                "listaPedido"
            );


        /*
           Obtener pedido
           correspondiente a ESTA mesa.
        */

        let pedido =
            JSON.parse(
                localStorage.getItem(
                    clavePedido
                )
            ) || [];


        /*
           Limpiar lista.
        */

        lista.innerHTML = "";


        /*
           Si no hay productos.
        */

        if (
            pedido.length === 0
        ) {

            lista.innerHTML = `

                <div class="pedido-vacio">

                    <div class="emoji">
                        🛒
                    </div>

                    <h3>
                        Tu pedido está vacío
                    </h3>

                    <p>
                        Agrega productos desde el menú.
                    </p>

                </div>

            `;


            document.getElementById(
                "total"
            ).textContent =
                "Total: $0.00";


            document.getElementById(
                "btnEnviar"
            ).disabled = true;


            return;

        }


        /*
           Activar botón enviar.
        */

        document.getElementById(
            "btnEnviar"
        ).disabled = false;


        let total = 0;


        /*
           Mostrar productos.
        */

        pedido.forEach(
            function(producto, indice) {

                const precio =
                    Number(producto.precio) || 0;


                const cantidad =
                    Number(producto.cantidad) || 0;


                const subtotal =
                    precio * cantidad;


                total += subtotal;


                const elemento =
                    document.createElement(
                        "div"
                    );


                elemento.className =
                    "producto-pedido";


                elemento.innerHTML = `

                    <div class="info-pedido">

                        <h3>
                            ${producto.nombre}
                        </h3>

                        <p>
                            Precio:
                            $${precio.toFixed(2)}
                        </p>

                        <p class="cantidad-pedido">
                            Cantidad:
                            ${cantidad}
                        </p>

                    </div>


                    <div class="precio-pedido">

                        $${subtotal.toFixed(2)}

                    </div>


                    <button
                        type="button"
                        class="boton-eliminar"
                        onclick="eliminarProducto(${indice})">

                        Eliminar

                    </button>

                `;


                lista.appendChild(
                    elemento
                );

            }
        );


        /*
           Mostrar total.
        */

        document.getElementById(
            "total"
        ).textContent =
            "Total: $" +
            total.toFixed(2);

    }



    /* =====================================
       ELIMINAR PRODUCTO
    ===================================== */

    function eliminarProducto(
        indice
    ) {

        let pedido =
            JSON.parse(
                localStorage.getItem(
                    clavePedido
                )
            ) || [];


        /*
           Verificar que exista
           el producto.
        */

        if (
            indice < 0 ||
            indice >= pedido.length
        ) {

            return;

        }


        /*
           Eliminar producto.
        */

        pedido.splice(
            indice,
            1
        );


        /*
           Si ya no quedan productos,
           eliminar completamente
           el pedido de esta mesa.
        */

        if (
            pedido.length === 0
        ) {

            localStorage.removeItem(
                clavePedido
            );

        } else {

            /*
               Guardar cambios.
            */

            localStorage.setItem(
                clavePedido,
                JSON.stringify(
                    pedido
                )
            );

        }


        /*
           Actualizar pantalla.
        */

        mostrarPedido();

    }



    /* =====================================
       ENVIAR PEDIDO
    ===================================== */

    async function enviarPedido() {

        /*
           Obtener pedido actual.
        */

        let pedido =
            JSON.parse(
                localStorage.getItem(
                    clavePedido
                )
            ) || [];


        /*
           Verificar pedido vacío.
        */

        if (
            pedido.length === 0
        ) {

            alert(
                "Tu pedido está vacío."
            );

            return;

        }


        /*
           Calcular total.
        */

        let total = 0;


        pedido.forEach(
            function(producto) {

                const precio =
                    Number(producto.precio) || 0;


                const cantidad =
                    Number(producto.cantidad) || 0;


                total +=
                    precio * cantidad;

            }
        );


        /*
           Confirmar envío.
        */

        const confirmar =
            confirm(
                "¿Deseas enviar el pedido de la Mesa " +
                mesa +
                "?\n\n" +
                "Total: $" +
                total.toFixed(2)
            );


        if (!confirmar) {

            return;

        }


        /*
           Desactivar botón mientras
           se envía el pedido.
        */

        const botonEnviar =
            document.getElementById(
                "btnEnviar"
            );


        botonEnviar.disabled = true;


        botonEnviar.textContent =
            "⏳ Enviando pedido...";



        /* =================================
           SUPABASE
        ================================= */

        try {

            /*
               Verificar que Supabase
               esté conectado.
            */

            if (
                !window.supabaseClient
            ) {

                alert(
                    "❌ Supabase no está conectado."
                );

                botonEnviar.disabled = false;

                botonEnviar.textContent =
                    "✅ Enviar pedido";

                return;

            }


            /*
               Enviar pedido a Supabase.

               Se mantiene la estructura
               de tu tabla pedidos:
               
               mesa
               productos
               total
               estado
            */

            const resultado =
                await window.supabaseClient
                .from("pedidos")
                .insert([{

                    mesa: mesa,

                    productos: pedido,

                    total: total,

                    estado: "Pendiente"

                }]);


            /*
               Obtener posible error.
            */

            const error =
                resultado.error;


            /*
               Si Supabase devuelve error.
            */

            if (error) {

                console.error(
                    "Error Supabase:",
                    error
                );


                alert(
                    "❌ No se pudo enviar el pedido al restaurante.\n\n" +
                    error.message
                );


                botonEnviar.disabled = false;

                botonEnviar.textContent =
                    "✅ Enviar pedido";

                return;

            }


            /*
               Pedido enviado correctamente.
            */

            alert(
                "✅ Pedido enviado correctamente.\n\n" +
                "Mesa: " +
                mesa
            );


            /*
               Vaciar solamente
               el pedido de ESTA mesa.
            */

            localStorage.removeItem(
                clavePedido
            );


            /*
               Actualizar pantalla.
            */

            mostrarPedido();

        }

        catch (error) {

            console.error(
                "Error inesperado:",
                error
            );


            alert(
                "❌ Ocurrió un error al enviar el pedido.\n\n" +
                error.message
            );


            botonEnviar.disabled = false;

            botonEnviar.textContent =
                "✅ Enviar pedido";

        }

    }



    /* =====================================
       IR AL MENÚ
    ===================================== */

    function irAMenu() {

        window.location.href =
            "menu.html?mesa=" +
            encodeURIComponent(
                mesa
            );

    }



    /* =====================================
       IR AL INICIO
    ===================================== */

    function irAInicio() {

        window.location.href =
            "index.html?mesa=" +
            encodeURIComponent(
                mesa
            );

    }



    /* =====================================
       MOSTRAR AL CARGAR
    ===================================== */

    mostrarPedido();

</script>

</body>

</html>
